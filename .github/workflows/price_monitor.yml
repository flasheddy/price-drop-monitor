name: Price Monitor

on:
  # Enable the daily run after configuring a watchlist (see README).
  # schedule:
  #   - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Materialize watchlist
        env:
          WATCHLIST_CSV: ${{ secrets.WATCHLIST_CSV }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          if [ -n "$WATCHLIST_CSV" ]; then
            printf '%s\n' "$WATCHLIST_CSV" > data/watchlist.csv
          fi
          if [ ! -f data/watchlist.csv ] \
            && { [ -z "$GOOGLE_SHEETS_SPREADSHEET_ID" ] || [ -z "$GOOGLE_SHEETS_API_TOKEN" ]; }; then
            echo "::error::No watchlist configured. Set WATCHLIST_CSV or both Google Sheets secrets."
            exit 1
          fi

      - name: Run price monitor
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          WEBHOOK_ALERT_URL: ${{ secrets.WEBHOOK_ALERT_URL }}
        run: python run.py --send-alerts

      - name: Validate report against schema
        run: python validate.py

      - name: Upload history and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-monitor-data
          path: |
            data/price_history.csv
            data/latest_report.json
          if-no-files-found: ignore
          retention-days: 30
