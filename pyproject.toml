[project]
name = "price-drop-monitor"
version = "0.1.0"
description = "Automated price-drop tracker for cycling gear, tech hardware, and software deals with Google Sheets/CSV history and email/webhook alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "jsonschema>=4.20.0",
  "pydantic>=2.8.0",
  "selectolax>=1.0.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.18.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
